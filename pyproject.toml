[build-system]
requires = ["scikit-build-core>=0.4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "MolSanitizer"
version = "0.4.0"
description = "An Efficient In-silico Refinement pipeline for Virtual Screening (protonation, tautomers,...)"
readme = "README.md"
authors = [
    {name = "Thua-Phong Lam", email = "phong.lam@icm.uu.se"},
    {name = "Szymon Pach", email = "szymon.pach@icm.uu.se"},
    {name = "Israel Cabeza de Vaca", email = "israel.cabezadevaca@icm.uu.se"}
]
license = {text = "GPL 2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GPL 2.0",
    "Programming Language :: Python :: 3.10",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Drug Discovery",
]
keywords = ["docking", "drug design"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "rdkit",
    "gemmi",
    #"meeko @ git+https://github.com/forlilab/meeko.git@develop",
    "scipy",
    "pyaml"
]

[project.urls]
Homepage = "https://github.com/phonglam3103/MolSanitizer.git"

[project.scripts]
msani = "msani.cli:main"
msani_batch = "msani.batchmode:main"
strain = "msani.filtering.strain_filter:main"
ionizer = "msani.moltransform.ionizer:main"
tautomerizer = "msani.moltransform.tautomerizer:main"
gen3d = "msani.conformers.conformers:main"

[tool.setuptools]
packages = ["msani"]

[tool.scikit-build]
# Configure CMake build for the C++ extension
cmake.source-dir = "msani/conformers/cpp"
cmake.minimum-version = "3.15"
cmake.args = [
    "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX",
    "-DCMAKE_FIND_ROOT_PATH=$CONDA_PREFIX",
    "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
    "-DCMAKE_CXX_FLAGS=-O3 -DNDEBUG",
    "-DBUILD_SHARED_LIBS=OFF"
]
# Install the built .so file into the msani package
install.components = ["python"]
wheel.packages = ["msani"]


