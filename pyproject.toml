[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "MolSanitizer"
version = "0.7.0"
description = "An Efficient In-silico Refinement pipeline for Virtual Screening (protonation, tautomers,...)"
readme = "README.md"
authors = [
    {name = "Thua-Phong Lam", email = "phong.lam@icm.uu.se"},
    {name = "Szymon Pach", email = "szymon.pach@icm.uu.se"},
    {name = "Israel Cabeza de Vaca", email = "israel.cabezadevaca@icm.uu.se"}
]
license = {text = "GPL 2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3.10",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["docking", "drug design"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas",
    "numpy",
    # The Python package remains the Python-level API provider. Native wheels
    # are built against the matching private RDKit C++ SDK.
    "rdkit==2025.9.5",
    "gemmi",
    "scipy",
    "pyaml"
]

[project.optional-dependencies]
pdbqt = ["meeko>=0.7.1"]

[project.urls]
Homepage = "https://github.com/phonglam3103/MolSanitizer.git"

[project.scripts]
msani = "msani.cli:main"
msani_batch = "msani.batchmode:main"
strain = "msani.filtering.strain_filter:main"
ionizer = "msani.moltransform.ionizer:main"
tautomerizer = "msani.moltransform.tautomerizer:main"
gen3d = "msani.conformers.conformers:main"

[tool.setuptools]
packages = ["msani"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.version = ">=3.20"
cmake.build-type = "Release"
# Install the built .so files into the msani package
install.components = ["python"]
wheel.packages = ["msani"]
# Native source and build artifacts belong in the sdist, not a binary wheel.
wheel.exclude = [
    "**/.DS_Store",
    "**/__pycache__/**",
    "msani/**/*.cpp",
    "msani/**/*.h",
    "msani/**/*.hpp",
    "msani/**/CMakeLists.txt",
    "msani/**/*.a",
]
wheel.license-files = ["LICENSE", "msani/amsol/LICENSE", "third_party/rdkit/LICENSE"]
sdist.exclude = ["build/**", "dist/**", "**/.DS_Store", "**/__pycache__/**", "msani/**/*.a"]
# Useful for development rebuilds
build-dir = "build/{wheel_tag}"
