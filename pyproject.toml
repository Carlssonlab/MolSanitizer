[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "MolSanitizer"
version = "0.7.4"
description = "An open-source pipeline to prepare large-scale small-molecule databases for virtual screening"
readme = "README.md"
authors = [
    {name = "Thua-Phong Lam", email = "phong.lam@icm.uu.se"},
    {name = "Szymon Pach", email = "szymon.pach@pharmazie.uni-marburg.de"},
    {name = "Israel Cabeza de Vaca", email = "israel.cabezadevaca@icm.uu.se"}
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["docking", "drug design", "virtual screening", "cheminformatics", "molecular modeling", "ligand preparation"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "pandas",
    "numpy",
    "rdkit>=2025.3.1",
    "pyaml",
    "platformdirs>=4"
]

[project.optional-dependencies]
oe = ["openeye-toolkits"]
pdbqt = ["meeko>=0.7.1", "scipy", "gemmi"]

[project.urls]
Homepage = "https://github.com/carlssonlab/MolSanitizer.git"

[project.scripts]
msani = "msani.cli:main"
msani_batch = "msani.batchmode:main"
strain = "msani.filtering.strain_filter:main"
m_ionizer = "msani.moltransform.ionizer:main"
m_tautomerizer = "msani.moltransform.tautomerizer:main"
gen3d = "msani.conformers.conformers:main"

[tool.scikit-build]
cmake.source-dir = "."
cmake.version = ">=3.20"
cmake.build-type = "Release"
# Install the built .so files into the msani package
install.components = ["python"]
wheel.packages = ["msani"]
# Native source and build artifacts belong in the sdist, not a binary wheel.
wheel.exclude = [
    "msani/cpp/**",
    "msani/amsol/amsolcpp/**",
    "**/.DS_Store",
    "**/__pycache__/**",
    "msani/**/*.cpp",
    "msani/**/*.h",
    "msani/**/*.hpp",
    "msani/**/CMakeLists.txt",
    "msani/**/*.a",
]
wheel.license-files = [
    "LICENSE",
    "msani/cpp/amsol/LICENSE",
    "third_party/rdkit/LICENSE",
    "third_party/boost/LICENSE",
    "third_party/bzip2/LICENSE",
    "third_party/xz/LICENSE",
    "third_party/zstd/LICENSE",
    "third_party/libcxx/LICENSE",
    "third_party/zlib/LICENSE",
]
sdist.exclude = ["build/**", "dist/**", "**/.DS_Store", "**/__pycache__/**", "msani/**/*.a"]
# Useful for development rebuilds
build-dir = "build/{wheel_tag}"
