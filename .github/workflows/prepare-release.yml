# Open a pull request that prepares the changelog for a release tag.
#
# main is protected, so nothing here pushes to it. The PR is authored by the
# github-actions bot, which means a maintainer can review and approve it
# normally. After it is merged, tag the merge commit (X.Y.Z) and the Wheels
# workflow builds and publishes. See packaging/RELEASE.md.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests". PRs opened with the default token do not trigger
# other workflows; to have CI run on them, add a RELEASE_BOT_TOKEN secret (a
# GitHub App token or a PAT from a bot account, not from the reviewer).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag, for example 0.7.5 (no leading v)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Validate the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || { echo "::error::Bad release tag '$VERSION'"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::Release tag '$VERSION' already exists"
            exit 1
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --offline --unreleased --use-branch-tags --strip all --tag "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          OUTPUT: ${{ runner.temp }}/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Prepend release notes to both changelogs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc

          # Give Pandoc a top-level title so it uses the existing RST heading levels.
          { printf '# Changelog\n\n'; cat "$RUNNER_TEMP/release-notes.md"; } |
            pandoc --from=markdown --to=rst -o "$RUNNER_TEMP/release-notes.rst"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"].encode("ascii")
          temp = Path(os.environ["RUNNER_TEMP"])
          release = rb"\[([^\]\r\n]+)\] - \d{4}-\d{2}-\d{2}"
          updates = {}

          for filename, notes, pattern in (
              ("CHANGELOG.md", "release-notes.md", rb"## " + release),
              ("docs/source/changes.rst", "release-notes.rst", release + rb"\r?\n-+"),
          ):
              path = Path(filename)
              history = path.read_bytes()
              fragment = (temp / notes).read_bytes()
              heading = re.compile(rb"^" + pattern + rb"\r?$", re.MULTILINE)
              first_release = heading.search(history)
              new_release = heading.search(fragment)
              if not first_release:
                  raise SystemExit(f"No release heading found in {path}")
              if version in heading.findall(history):
                  raise SystemExit(f"{path} already contains release {version.decode()}")
              if not new_release or heading.findall(fragment) != [version]:
                  raise SystemExit(f"Expected only release {version.decode()} in {notes}")

              # Preserve the introduction and all existing release notes byte for byte.
              offset = first_release.start()
              new_notes = fragment[new_release.start():].rstrip()
              updates[path] = history[:offset] + new_notes + b"\n\n" + history[offset:]

          for path, content in updates.items():
              path.write_bytes(content)
          PY

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          branch: release/${{ inputs.version }}
          base: main
          commit-message: "chore(release): prepare for ${{ inputs.version }}"
          title: "Release ${{ inputs.version }}"
          body: |
            Prepares the changelog for `${{ inputs.version }}`.
            Package and documentation versions are derived from Git tags.

            After merging, tag this PR's merge commit:

            ```
            git tag ${{ inputs.version }} <release-merge-commit-sha>
            git push origin ${{ inputs.version }}
            ```

            Later commits automatically receive development versions; no version-bump PR is needed.
          add-paths: |
            docs/source/changes.rst
            CHANGELOG.md
          delete-branch: true
