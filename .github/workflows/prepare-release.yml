# Open a pull request that prepares the changelog for a release tag.
#
# main is protected, so nothing here pushes to it. The PR is authored by the
# github-actions bot, which means a maintainer can review and approve it
# normally. After it is merged, tag the merge commit (X.Y.Z) and the Wheels
# workflow builds and publishes. See packaging/RELEASE.md.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests". PRs opened with the default token do not trigger
# other workflows; to have CI run on them, add a RELEASE_BOT_TOKEN secret (a
# GitHub App token or a PAT from a bot account, not from the reviewer).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag, for example 0.7.5 (no leading v)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Validate the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || { echo "::error::Bad release tag '$VERSION'"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::Release tag '$VERSION' already exists"
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag ${{ inputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Convert changelog for the docs
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc CHANGELOG.md -o docs/source/changes.rst

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          branch: release/${{ inputs.version }}
          base: main
          commit-message: "chore(release): prepare for ${{ inputs.version }}"
          title: "Release ${{ inputs.version }}"
          body: |
            Prepares the changelog for `${{ inputs.version }}`.
            Package and documentation versions are derived from Git tags.

            After merging, tag this PR's merge commit:

            ```
            git tag ${{ inputs.version }} <release-merge-commit-sha>
            git push origin ${{ inputs.version }}
            ```

            Later commits automatically receive development versions; no version-bump PR is needed.
          add-paths: |
            docs/source/changes.rst
            CHANGELOG.md
          delete-branch: true
