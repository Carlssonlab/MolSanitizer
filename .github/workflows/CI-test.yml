name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick check on all major OSes with Python 3.11
  quick-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: latest
          environment-file: environment.yml
          environment-name: msani
          create-args: python=${{ matrix.python-version }}
          condarc: |
            channels:
              - conda-forge
              - rdkit
          cache-downloads: true
          cache-environment: true

      - name: Install in editable mode (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: pip install -e .


      - name: Set up Visual Studio (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install in editable mode (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: micromamba run -n msani pip install -e .

      - name: Run unittests (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: python -m unittest discover -s test

      - name: Run unittests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: micromamba run -n msani python -m unittest discover -s test

  # Full matrix only runs when main branch is updated
  full-matrix:
    if: github.ref == 'refs/heads/main'
    needs: quick-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-22.04
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: latest
          environment-file: environment.yml
          environment-name: msani
          create-args: python=${{ matrix.python-version }}
          condarc: |
            channels:
              - conda-forge
              - rdkit
          cache-downloads: true
          cache-environment: true

      - name: Install in editable mode (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: pip install -e .

      - name: Install in editable mode (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: micromamba run -n msani pip install -e .

      - name: Run unittests (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: python -m unittest discover -s test

      - name: Run unittests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: micromamba run -n msani python -m unittest discover -s test
