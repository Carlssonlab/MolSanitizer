name: Generate Changelog

on:
  push:
    branches:
      - '**'
    tags:
      - '**'  # Triggers the workflow on all tag pushes

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Check if there are any changes in CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then
            echo "No changes detected in CHANGELOG.md. Skipping commit."
          else
            git add CHANGELOG.md
            git commit -m "Update changelog for tag ${{ github.ref_name }}"
            # Push the changes to the default branch (e.g., 'main')
            git push origin HEAD:main
          fi
