name: Update Version and Generate Changelog on Tag Push

on:
  push:
    tags:
      - "*"  # Trigger on any tag push

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history

    - name: Checkout main branch
      run: |
        git checkout main

    - name: Extract tag version
      run: |
        VERSION=$(git describe --tags --abbrev=0)
        echo "Extracted VERSION: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV  # Persist across steps

    - name: Update version in files
      run: |
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
        sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" msani/cli.py
        sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" msani/batchmode.py

    - name: Generate Changelog
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --verbose
      env:
        OUTPUT: CHANGELOG.md
        GITHUB_REPO: ${{ github.repository }}

    - name: Commit updated files selectively
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        CHANGED_FILES=0

        if ! git diff --quiet pyproject.toml; then
          git add pyproject.toml
          CHANGED_FILES=1
        fi

        if ! git diff --quiet msani/cli.py; then
          git add msani/cli.py
          CHANGED_FILES=1
        fi

        if ! git diff --quiet msani/batchmode.py; then
          git add msani/batchmode.py
          CHANGED_FILES=1
        fi

        if ! git diff --quiet CHANGELOG.md; then
          git add CHANGELOG.md
          CHANGED_FILES=1
        fi

        if [ $CHANGED_FILES -eq 1 ]; then
          git commit -m "Update version to $VERSION and changelog"
          git push origin HEAD:main
        else
          echo "No changes detected, skipping commit."
        fi
      env:
        VERSION: ${{ env.VERSION }}

    - name: Delete and recreate the tag
      run: |
        git tag -d $VERSION || true
        git push origin --delete $VERSION || true
        git tag $VERSION
        git push origin --tags
      env:
        VERSION: ${{ env.VERSION }}
