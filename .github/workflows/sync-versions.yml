name: Update Version and Generate Changelog on Tag Push

on:
  push:
    tags:
      - "*"  # Trigger on any tag push

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0  # Fetch full history

    - name: Checkout main branch
      run: |
        git checkout main

    - name: Extract tag version
      run: |
        VERSION=$(git describe --tags --abbrev=0)
        echo "Extracted VERSION: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV  # Persist across steps

    - name: Update version in files
      run: |
        # pyproject.toml is the single source of truth for the version.
        # cli.py and batchmode.py now read the version via importlib.metadata,
        # so they no longer contain a __version__ = "..." line to update.
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
        sed -i "s/^release = .*/release = \"$VERSION\"/" docs/source/conf.py
        sed -i "s/^version = .*/version = \"$VERSION\"/" docs/source/conf.py

    - name: Generate Changelog
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --verbose
      env:
        OUTPUT: CHANGELOG.md
        GITHUB_REPO: ${{ github.repository }}

    - name: Commit updated files selectively
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        CHANGED_FILES=0

        if ! git diff --quiet pyproject.toml; then
          git add pyproject.toml
          CHANGED_FILES=1
        fi

        if ! git diff --quiet CHANGELOG.md; then
          git add CHANGELOG.md
          CHANGED_FILES=1
        fi

        if ! git diff --quiet docs/source/conf.py; then
          git add docs/source/conf.py
          CHANGED_FILES=1
        fi

        if [ $CHANGED_FILES -eq 1 ]; then
          git commit -m "Update version to $VERSION and changelog"
          git remote set-url origin https://x-access-token:${PERSONAL_ACCESS_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:main
        else
          echo "No changes detected, skipping commit."
        fi
      env:
        VERSION: ${{ env.VERSION }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Delete and recreate the tag
      run: |
        git tag -d $VERSION || true
        git push origin --delete $VERSION || true
        git tag $VERSION
        git push origin --tags
      env:
        VERSION: ${{ env.VERSION }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
