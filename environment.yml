name: msani


channels:
  - conda-forge
  - rdkit

dependencies:
  - python>=3.10,<3.15
  - numpy
  - pandas
  - pip
  # They are pinned to the release the wheel SDK is built with, because the
  # conformers produced depend on the RDKit release. RDKit >= 2026.09 makes the
  # optional ETKDGv4 embedders available; older releases still build. To build
  # against an older release, pin both lines to it, e.g. rdkit=2025.9.1 and
  # librdkit-dev=2025.9.1.
  - rdkit=2026.9.2
  - librdkit-dev=2026.9.2
  - libboost-devel
  - scikit-build-core
  - openbabel
  - pyaml
  - gemmi
  - cmake<=3.29
  - pybind11
  - eigen
  - compilers
  - pkg-config
  - make
  - ninja
