name: msani


channels:
  - conda-forge
  - rdkit

dependencies:
  - python>=3.10,<3.15
  - numpy
  - pandas
  - pip
  # The Python package and the C++ headers must be the same RDKit release.
  # RDKit >= 2026.09 enables ETKDGv4 embedding; older releases still build and
  # fall back to srETKDGv3. To build against an older release, pin both lines
  # to it, e.g. rdkit=2025.9.1 and librdkit-dev=2025.9.1.
  - rdkit>=2025.9.1
  - librdkit-dev>=2025.9.1
  - libboost-devel
  - scikit-build-core
  - openbabel
  - pyaml
  - gemmi
  - cmake<=3.29
  - pybind11
  - eigen
  - compilers
  - pkg-config
  - make
  - ninja
