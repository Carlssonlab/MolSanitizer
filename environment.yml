name: msani


channels:
  - conda-forge
  - rdkit

dependencies:
  - python>=3.10,<3.15
  - numpy
  - pandas
  - pip
  # They are pinned to the release the wheel SDK is built with, because the
  # conformers produced depend on the RDKit release. A source build needs
  # RDKit >= 2026.09: the stereoisomer extension uses its internal-coordinate
  # embedding and refuses to compile against older headers. (Wheels from PyPI
  # link RDKit statically and still run with older Python RDKit releases.)
  - rdkit=2026.9.2
  - librdkit-dev=2026.9.2
  - libboost-devel
  - scikit-build-core
  - openbabel
  - pyaml
  - gemmi
  - cmake<=3.29
  - pybind11
  - eigen
  - compilers
  - pkg-config
  - make
  - ninja
