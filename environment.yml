name: msani


channels:
  - conda-forge
  - rdkit

dependencies:
  - python>=3.10,<3.15
  - numpy
  - pandas
  - pip
  # Keep CI's Python package and C++ headers aligned with the release SDK.
  - rdkit=2025.9.1
  - librdkit-dev=2025.9.1
  - libboost-devel
  - scikit-build-core
  - openbabel
  - pyaml
  - gemmi
  - cmake<=3.29
  - pybind11
  - eigen
  - compilers
  - pkg-config
  - make
  - ninja
